<section class="contato">

  <h1 class="titulo">Contato</h1>

  <div class="contato-container">

    <!-- FORMULÁRIO -->
    <form class="form-contato" (submit)="onSubmit($event)">

      <div class="input-group">
        <input type="text" required>
        <label>Seu Nome</label>
      </div>

      <div class="input-group">
        <input type="email" required>
        <label>Seu Email</label>
      </div>

      <div class="input-group">
        <textarea rows="5" required></textarea>
        <label>Mensagem</label>
      </div>

      <button type="submit" class="btn-contato">Enviar Mensagem</button>

    </form>

    <!-- INFORMAÇÕES -->
    <div class="info-contato">

      <h2>Fale comigo</h2>

      <p>📧 Email: wellingtmax&#64;gmail.com</p>
      <p>📱 WhatsApp: (24) 9 9994-6786</p>
      <p>📍 Local: Volta Redonda - RJ</p>

      <div class="socials">
        <a href="#"><img src="icons/github-brands-solid.png"></a>
        <a href="#"><img src="icons/square-linkedin-brands-solid.png"></a>
        <a href="#"><img src="icons/instagram-brands-solid.png"></a>
      </div>

    </div>

  </div>

</section>
