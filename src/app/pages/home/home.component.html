<section class="home">
    <div class="home-content">
        <h3>Olá, eu sou</h3>
        <h1>J H O T A</h1>
        <div class="carr">
            <p class="font">01001010 &nbsp; 01001000 &nbsp; 01001111 &nbsp; 01010100 &nbsp; 01000001</p>
        </div>
        <p style="font-weight: bold; font-size: 25px;">D e s e n v o l v e d o r &nbsp;&nbsp;&nbsp; F U L L - S T A C K
        </p>
    </div>

    <div class="carousel">
        <button class="btn left" (click)="scrollLeft()"><</button>
                <div class="carousel-track" #carouselTrack>

                    <!-- os cards aqui -->
                    <div class="card-pro" *ngFor="let item of carouselItems">
                        <img [src]="item.img" alt="projetos" class="card-image">

                        <div class="card-content">
                            <h2>{{ item.titulo }}</h2>
                            <p>{{ item.descricao }}</p>
                            <div class="tags">
                                <span class="tag" *ngFor="let tag of item.tags">
                                    {{ tag }}
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
                <button class="btn right" (click)="scrollRight()">></button>
            </div>

</section>
